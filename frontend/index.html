<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Catálogo RyC de especies para arbolado urbano — CONAF. 1.016 especies con criterios de selección urbana, distribución regional y fichas técnicas."
    />
    <title>Especies para Arbolado Urbano</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // El tema se aplica antes del primer paint. Con un useEffect correría
      // después y cargar en oscuro daría un flash blanco en cada recarga.
      try {
        var t = localStorage.getItem('tema')
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
